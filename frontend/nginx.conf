server {
    listen 80;
    root /usr/share/nginx/html;

    # One photo is at most 5 MiB plus multipart overhead (the API enforces the real limit).
    client_max_body_size 6m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # The Go API, with the /api prefix stripped. X-Real-IP lets its per-IP
    # rate limits see the visitor instead of this proxy (TRUST_PROXY=true).
    location /api/ {
        proxy_pass http://api:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite fingerprints asset names, so they can be cached forever.
    location /assets/ {
        expires 1y;
    }

    # Single-page app: unknown paths (/lelang/12, /jual) get index.html.
    location / {
        try_files $uri /index.html;
        expires -1;
    }
}
