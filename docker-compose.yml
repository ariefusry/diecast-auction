services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-diecast}
      # Required, no default: read only when pgdata is first created, later changes need `down -v`.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (openssl rand -hex 24)}
      POSTGRES_DB: ${POSTGRES_DB:-diecast}
    # Loopback only: containers reach it as db:5432, the host as localhost:5432.
    # A published port bypasses ufw on Linux, so never expose it on a server.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Full stack: `docker compose up --build`, then open http://localhost:8081.
  # Needs JWT_SECRET (32+ bytes, openssl rand -hex 32) in .env; GEMINI_API_KEY is optional.

  # Demo catalog and demo accounts: opt in with `docker compose --profile demo up`.
  # Their password defaults to the one printed in the repo; a public server sets
  # DEMO_PASSWORD so those accounts stay closed. Idempotent: runs once per database.
  seed:
    profiles: [demo]
    build: { context: ., dockerfile: Dockerfile.backend }
    image: blister64-backend
    command: ["/app/seed"]
    environment:
      DATABASE_URL: &db-url postgres://${POSTGRES_USER:-diecast}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-diecast}?sslmode=disable
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  api:
    build: { context: ., dockerfile: Dockerfile.backend }
    image: blister64-backend
    environment:
      DATABASE_URL: *db-url
      JWT_SECRET: ${JWT_SECRET:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      # Only reachable through nginx below, which sets X-Real-IP.
      TRUST_PROXY: "true"
      CORS_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost:8081}
    volumes:
      - uploads:/data/uploads
    # Not on seed: it is opt-in, and both run the migrations under an advisory lock.
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped

  # The React build behind nginx; /api/* is proxied to the api service.
  web:
    build: { context: frontend, dockerfile: ../Dockerfile.frontend }
    image: blister64-web
    ports:
      - "${WEB_PORT:-8081}:80"
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  # HTTPS for a server, see Caddyfile. Also set WEB_PORT=127.0.0.1:8081 so
  # visitors reach nginx only through Caddy.
  caddy:
    image: caddy:2.10.2-alpine
    profiles: [https]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web: { condition: service_started }
    restart: unless-stopped

  # Throwaway database for tests: tmpfs, never touches dev data.
  testdb:
    image: postgres:15-alpine
    profiles: [test]
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d test"]
      interval: 2s
      timeout: 3s
      retries: 15

  # go test -race needs cgo + gcc, which the golang image has and the Windows host lacks.
  test:
    image: golang:1.27
    profiles: [test]
    working_dir: /src
    environment:
      CGO_ENABLED: "1"
      TEST_DATABASE_URL: postgres://test:test@testdb:5432/test?sslmode=disable
    volumes:
      - .:/src
      - gomod:/go/pkg/mod
      - gobuild:/root/.cache/go-build
    depends_on:
      testdb:
        condition: service_healthy
    command: go test -race ./...

volumes:
  caddy_data:
  caddy_config:
  uploads:
  pgdata:
  gomod:
  gobuild:
